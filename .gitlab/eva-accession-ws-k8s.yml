
# Shared .build_docker / .update_and_deploy templates live in eva-k8s
# See https://github.com/EBIvariation/eva-k8s/blob/main/gitlab-ci/webservice.yml.
include:
  - remote: 'https://raw.githubusercontent.com/EBIvariation/eva-k8s/refs/tags/v1.0/gitlab-ci/webservice.yml'

# REQUIRED GitLab CI/CD Variables (Global):
# DOCKER_AUTH_CONFIG: Contains username and password for the docker registry above
# GITHUB_USER: GitHub username for accessing private maven settings repository
# GITHUB_TOKEN: GitHub personal access token for accessing private maven settings repository

# ============================================================================
# PRODUCTION: Deploy on tags
# ============================================================================

build:docker:prod:
  extends: .build_docker
  variables:
    SERVICE_NAME: eva-accession-ws
    IMAGE_REPOSITORY: dockerhub.ebi.ac.uk/ebivariation/eva-accession
    IMAGE_TAG: eva-accession-ws-$CI_COMMIT_TAG
  only:
    - tags

deploy-to-cluster:prod:
  extends: .update_and_deploy
  needs:
    - build:docker:prod
  variables:
    SERVICE_NAME: eva-accession-ws
    IMAGE_TAG: eva-accession-ws-$CI_COMMIT_TAG
    ENV: prod
    MAVEN_PROFILE: production
    K8S_MANIFEST_PATH: k8s-manifests/eva-accession-ws/overlays/prod
    K8S_NAMESPACE: eva-accession-ws-prod
    KUBECONFIG_FILE: $KUBECONFIG_FILE_PROD
  environment:
    name: prod
  only:
    - tags

# ============================================================================
# DEVELOPMENT: Deploy on master branch
# ============================================================================

build:docker:dev:
  extends: .build_docker
  variables:
    SERVICE_NAME: eva-accession-ws
    IMAGE_REPOSITORY: dockerhub.ebi.ac.uk/ebivariation/eva-accession
    IMAGE_TAG: eva-accession-ws-dev-$CI_COMMIT_SHORT_SHA
  only:
    - master

deploy-to-cluster:dev:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: eva-accession-ws
    IMAGE_TAG: eva-accession-ws-dev-$CI_COMMIT_SHORT_SHA
    ENV: development
    MAVEN_PROFILE: development
    K8S_MANIFEST_PATH: k8s-manifests/eva-accession-ws/overlays/dev
    K8S_NAMESPACE: eva-accession-ws-dev
    KUBECONFIG_FILE: $KUBECONFIG_FILE_DEV
  environment:
    name: development
  only:
    - master

# ============================================================================
# STAGING: Deploy on master branch
# ============================================================================

deploy-to-cluster:staging:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: eva-accession-ws
    IMAGE_TAG: eva-accession-ws-dev-$CI_COMMIT_SHORT_SHA
    ENV: staging
    MAVEN_PROFILE: production_processing
    K8S_MANIFEST_PATH: k8s-manifests/eva-accession-ws/overlays/staging
    K8S_NAMESPACE: eva-accession-ws-stage
    KUBECONFIG_FILE: $KUBECONFIG_FILE_STAGING
  environment:
    name: staging
  only:
    - master
