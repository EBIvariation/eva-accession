accessioning.instanceId=rest-instance

accessioning.submitted.categoryId=ss
accessioning.monotonic.ss.blockSize=100000
accessioning.monotonic.ss.blockStartValue=5000000000
accessioning.monotonic.ss.nextBlockInterval=1000000000

accessioning.clustered.categoryId=rs
accessioning.monotonic.rs.blockSize=100000
accessioning.monotonic.rs.blockStartValue=3000000000
accessioning.monotonic.rs.nextBlockInterval=1000000000

# Database connection details for mongodb and postgres, contig-alias.url and eva.api.base-url are supplied at runtime, not baked into this file:
#   - In Kubernetes, via a Secret mounted at /app/config/application.properties.
#   - For local IDE / mvn spring-boot:run, via a git-ignored ./config/application.properties
#     (Spring Boot automatically loads config/ relative to the working directory).

# spring.data.mongodb.uri=mongodb://|eva.mongo.user|:|eva.mongo.passwd.url-encoded|@|eva.mongo.host|/admin
# spring.data.mongodb.database=|eva.accession.mongo.database|
# mongodb.read-preference=|eva.mongo.read-preference|

# human.mongodb.uri=mongodb://|eva.mongo.user|:|eva.mongo.passwd.url-encoded|@|eva.mongo.host|/admin
# human.mongodb.database=|eva.accession.mongo.human.database|

# continuous.id.blocks.datasource.jdbc-url=|eva.accession.jdbc.url|
# continuous.id.blocks.datasource.username=|eva.accession.user|
# continuous.id.blocks.datasource.password=|eva.accession.password|

# contig-alias.url=|contig-alias.url|

# eva.api.base-url=|eva.api.base-url|

server.servlet.context-path=/eva/webservices/identifiers

continuous.id.blocks.datasource.driver-class-name=org.postgresql.Driver

parameters.mongodb.writeConcern=ACKNOWLEDGED

# Actuator is served on its own port
management.server.port=9090
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
# Liveness/readiness probes served without authentication at
# <context-path>/livez and <context-path>/readyz
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.metrics.tags.application=eva-accession-ws
management.info.git.mode=simple

# Base URL used to build safe redirect responses (must not end with a slash).
# Set this to the canonical public URL of the API in each deployment environment.

# See https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-2.1-Release-Notes#bean-overriding
spring.main.allow-bean-definition-overriding=true

server.tomcat.basedir=/tmp/tomcat
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

